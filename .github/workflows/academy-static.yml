name: Validate Pilot Academy (no deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check synced web/mobile and payment safety
        run: node tests/academy-static.cjs
      - name: Check paid-content authorization invariants
        run: node tests/security-invariants.cjs
      - name: Scan tracked files for embedded secrets
        run: node tests/security-audit.cjs
