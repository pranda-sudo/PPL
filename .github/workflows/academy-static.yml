name: Validate and publish Pilot Academy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check synced web/mobile and payment safety
        run: node tests/academy-static.cjs
      - name: Check paid-content authorization invariants
        run: node tests/security-invariants.cjs
      - name: Scan tracked files for embedded secrets
        run: node tests/security-audit.cjs
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public web assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
